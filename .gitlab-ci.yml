stages:
  - tagChecking
  - build
  - test
  - coverage
  - sonarqube
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

tag-checker:
  stage: tagChecking
  script:
    - python3 tag_checker.py $CI_COMMIT_TAG
  only:
    - tags

junit:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    paths:
      - build/test-results/test/*.xml
      - build/jacoco/test.exec
    reports:
      junit: build/test-results/test/*.xml

sonarqube-report:
  stage: sonarqube
  script:
    - ./gradlew sonar -Dsonar.qualitygate.wait=true

integration-tests:
  stage: test
  script:
    - ./gradlew integration
  artifacts:
    when: always
    paths:
      - build/test-results/integration/*.xml
      - build/jacoco/integration.exec
    reports:
      junit: build/test-results/integration/*.xml
cucumber-acceptance-tests:
  stage: test
  script:
    - ./gradlew cucumber
  artifacts:
    when: always
    paths:
      - build/jacoco/cucumber.exec
      - build/test-results/cucumber/*.xml
    reports:
      junit: build/test-results/cucumber/*.xml

playwright-end2end-tests:
  stage: test
  script:
    - ./gradlew end2end
  artifacts:
    paths:
      - build/jacoco/playwright.exec

generate-test-coverage-reports:
  stage: coverage
  dependencies:
    - junit
    - integration-tests
    - cucumber-acceptance-tests
  script:
    - ./gradlew jacocoTestReport
    - ls ./build/jacoco
  artifacts:
    paths:
      - build/jacoco/*

# builds all branches, except dev and main
branch-build:
  stage: build
  script:
    - ./gradlew bootJar
  artifacts:
    paths:
      - build/libs
  except:
    - tags
    - main
    - dev

deploy-staging:
  stage: deploy
  script:
    - ./gradlew bootJar
    - rm -rf /home/gitlab-runner/staging/ || true
    - mkdir /home/gitlab-runner/staging/
    - cp -r ./build/libs /home/gitlab-runner/staging
    - cp runner-scripts/staging.sh /home/gitlab-runner/staging.sh
    - chmod u+x /home/gitlab-runner/staging.sh
    - echo "export DB_USERNAME=${DB_USERNAME}" > /home/gitlab-runner/staging/.env
    - echo "export DB_PASSWORD=${DB_PASSWORD}" >> /home/gitlab-runner/staging/.env
    - echo "export SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}" >> /home/gitlab-runner/staging/.env
    - echo "export SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}" >> /home/gitlab-runner/staging/.env
    - echo "export GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}" >> /home/gitlab-runner/staging/.env
    - sudo systemctl restart staging
  artifacts:
    paths:
      - build/libs
  only:
    - dev

deploy-production:
  stage: deploy
  script:
    - ./gradlew bootJar
    - rm -rf /home/gitlab-runner/production/ || true
    - mkdir /home/gitlab-runner/production/
    - cp -r ./build/libs /home/gitlab-runner/production
    - cp runner-scripts/production.sh /home/gitlab-runner/production.sh
    - echo "export DB_USERNAME=${DB_USERNAME}" > /home/gitlab-runner/production/.env
    - echo "export DB_PASSWORD=${DB_PASSWORD}" >> /home/gitlab-runner/production/.env
    - echo "export SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}" >> /home/gitlab-runner/production/.env
    - echo "export SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}" >> /home/gitlab-runner/production/.env
    - echo "export GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}" >> /home/gitlab-runner/production/.env
    - chmod u+x /home/gitlab-runner/production.sh
    - sudo systemctl restart production
  artifacts:
    paths:
      - build/libs
  only:
    - tags
