<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>Edit Profile</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>

<script>
    function updateFileName() {
        let fileInput = document.getElementById('formFile');
        let fileLabel = document.getElementById('fileLabel');
        let maxLength = 30; // Available space

        if (fileInput.files.length > 0) {
            let fileName = fileInput.files[0].name;

            // If filename is too long, reset to "Edit Profile Picture"
            fileLabel.textContent = fileName.length > maxLength ? "Edit Profile Picture" : fileName;
        } else {
            fileLabel.textContent = "Edit Profile Picture";
        }
    }
</script>

<body>
<div class="container mt-5">
    <div class="card p-4 shadow">
        <h4 class="card-title mb-5">Edit profile</h4>
        <div class="position-absolute top-0 end-0 m-3 d-flex gap-2">
            <form th:action="@{/user/uploadProfilePicture}" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <input class="form-control d-none" type="file" id="formFile" name="file" onchange="updateFileName()">
                    <label class="btn btn-outline-secondary" for="formFile" id="fileLabel">Edit Profile Picture</label>
                    <input type="submit" class="btn btn-primary" value="Upload">
                </div>
            </form>
        </div>

        <img th:src="@{'/profile_pictures/' + ${profilePictureFileName}}" alt="Profile Picture">

        <form th:action="@{/user/edit}" method="post">
            <div class="form-group mb-3">
                <div class="mb-3">
                    <input type="text" class="form-control" id="first-name" name="firstName" placeholder="First Name" aria-label="first-name" th:value="${firstName}">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" id="last-name" name="lastName" placeholder="Last Name" aria-label="last-name" th:value="${lastName}">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" id="email" name="email" placeholder="Email" aria-label="email" th:value="${email}">
                </div>
                <div th:if="${errorMessages}" class="alert alert-danger mb-4" role="alert">
                    <ul>
                        <li th:each="error : ${errorMessages}" th:text="${error}"></li>
                    </ul>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
                <a th:href="@{/user}" class="btn btn-outline-secondary m-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
