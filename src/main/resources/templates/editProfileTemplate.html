<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <base th:href="@{/}"/>
    <title>Edit Profile</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/toggleSwitchStyles.css}"/>
</head>

<body>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div class="container mt-5">
    <div class="card p-4 shadow">
        <h4 class="card-title mb-5">Edit profile</h4>
        <div class="position-absolute top-0 end-0 m-3 d-flex gap-2">
            <form th:action="@{/user/edit/profile-picture}" method="POST" enctype="multipart/form-data">
                <div class="input-group">
                    <input class="form-control d-none" type="file" id="formFile" name="file">
                    <label class="btn btn-outline-secondary" for="formFile" id="fileLabel">Edit Profile Picture</label>
                    <input type="submit" class="btn btn-primary" value="Upload">
                </div>
            </form>
        </div>

        <div class="d-flex justify-content-start align-items-center mb-4">
            <!-- Profile Picture -->
            <div class="me-4 text-center">
                <img th:src="@{'/profile_pictures/' + ${profilePicture}}"
                     alt="Profile Picture"
                     class="img-fluid rounded-circle"
                     style="width: 200px; height: 200px; object-fit: cover;">
            </div>

            <div>
                <!-- Frontend JS error -->
                <div class="alert alert-danger" role="alert" id="profile-picture-frontend-error" hidden>
                    <ul id="profile-picture-frontend-error-message" class="mb-0"></ul>
                </div>

                <!-- Backend error -->
                <div class="alert alert-danger" role="alert" id="profile-picture-backend-error" th:if="${profilePictureError}">
                    <ul><li th:each="msg : ${profilePictureError}" th:text="${msg}"></li></ul>
                </div>
            </div>
        </div>


        <form th:action="@{/user/edit}" method="post" id="edit-profile-form" novalidate>
            <!-- FIRST NAME -->
            <div class="mb-3">
                <input type="text" class="form-control" id="first-name" name="firstName"
                       placeholder="First Name" th:value="${firstName}" aria-label="First name">

                <!-- Frontend JS error -->
                <div class="alert alert-danger mt-2" role="alert" id="first-name-frontend-error" hidden>
                    <ul><li><label class="form-label" id="first-name-frontend-error-message"></label></li></ul>
                </div>

                <!-- Backend error -->
                <div class="alert alert-danger mt-2" role="alert" id="first-name-backend-error" th:if="${firstNameError}">
                    <ul><li th:each="msg : ${firstNameError}" th:text="${msg}"></li></ul>
                </div>
            </div>

            <!-- LAST NAME -->
            <div class="mb-3">
                <input type="text" class="form-control" id="last-name" name="lastName"
                       placeholder="Last Name" th:value="${lastName}" aria-label="Last name">

                <!-- Frontend JS error -->
                <div class="alert alert-danger mt-2" role="alert" id="last-name-frontend-error" hidden>
                    <ul><li><label class="form-label" id="last-name-frontend-error-message"></label></li></ul>
                </div>

                <!-- Backend error -->
                <div class="alert alert-danger mt-2" role="alert" id="last-name-backend-error" th:if="${lastNameError}">
                    <ul><li th:each="msg : ${lastNameError}" th:text="${msg}"></li></ul>
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Email" th:value="${email}" aria-label="Email">

                <!-- Frontend JS error -->
                <div class="alert alert-danger mt-2" role="alert" id="email-frontend-error" hidden>
                    <ul><li><label class="form-label" id="email-frontend-error-message"></label></li></ul>
                </div>

                <!-- Backend error -->
                <div class="alert alert-danger mt-2" role="alert" id="email-backend-error" th:if="${emailError}">
                    <ul><li th:each="msg : ${emailError}" th:text="${msg}"></li></ul>
                </div>
            </div>

            <!-- LOCATION TOGGLE SWITCH -->
            <div class="d-flex justify-content-between align-items-center py-4 px-0" style="width: 25%">
                <div>Enter Location (Optional):</div>
                <div>
                    <label class="switch">
                        <input type="checkbox" id="location-toggleswitch" th:checked="${locationUsed}">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- LOCATION FORM FRAGMENT -->
            <div th:class="${locationUsed} ? 'form-extension' : 'hidden-form-extension'" id="location-form">
                <div th:replace="~{fragments/locationForm.html :: locationForm(
                     addressDTO=${addressDTO})}"></div>
            </div>


            <!-- Form submission buttons -->
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <button type="submit" id="submit-button" class="btn btn-primary">Submit</button>
                    <a th:href="@{/user}" class="btn btn-outline-secondary m-2">Cancel</a>
                </div>
                <div>
                    <a th:href="@{/user/edit/updatePassword}" class="btn btn-primary">Change Password</a>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
<script type="module" th:src="@{/js/locationForm.js}"></script>
<script type="module" th:src="@{/js/userValidation.js}"></script>
<script type="module" th:src="@{/js/profileValidation.js}"></script>
<script type="module" th:src="@{/js/profilePictureValidation.js}"></script>
</html>
