<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
  <base th:href="@{/}"/>
  <title> Home Helper </title>
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>

</head>
<body>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div id="container" class="card container mt-5 shadow-sm">
  <div id="content-container" class="content-container m-3">
    <div class="row">
      <div class="col-4">
        <div class="row">
          <h2>Inbox</h2>
        </div>
        <div class="row card" th:each="team: ${teams}">
          <h5 class="card-header" th:text="${team.getRenovationRecord().getName()}"></h5>
          <p class="card-body" th:text="|${team.getRenovationRecord().getUser().getFirstName()} ${team.getRenovationRecord().getUser().getLastName()}|"></p>
        </div>
      </div>
      <div class="col-8">
        <div th:replace="~{fragments/joinTeam.html :: join-team}"></div>
      </div>
    </div>
  </div>
</div>
</body>
<script type="module" th:src="@{/js/navbar.js}"></script>
</html>
