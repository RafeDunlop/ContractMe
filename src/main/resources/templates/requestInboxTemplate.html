<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
  <base th:href="@{/}"/>
  <title> Home Helper </title>
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>

</head>
<body>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div id="container" class="card px-0 container mt-5 shadow-sm">
  <div id="content-container" class="content-container m-3">
    <div class="row">
      <div class="col-4">
        <h1 class="text-center mb-3">Inbox</h1>
        <div class="inbox-scrollable-div px-2">
          <div class="mt-3 text-center" th:if="${teams.isEmpty()}">
            Your inbox is empty.
          </div>
          <div class="card my-2 team-request" th:attr="data-team-id=${team.getId()}" th:each="team: ${teams}">
            <h5 class="card-header" th:text="${team.getRenovationRecord().getName()}"></h5>
            <div class="card-body">
              <div th:each="role : ${team.getRoles()}" th:if="${role.getContractorId() == user.getId()}">
                <strong>Role:</strong>
                <span th:text="${role.getSkill().getDisplayName()}"></span>
              </div>
              <div>
                <strong>Owner:</strong>
                <span th:text="|${team.getRenovationRecord().getUser().getFirstName()} ${team.getRenovationRecord().getUser().getLastName()}|"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="join-team-container" class="col-8">
        <div id="join-team"></div>
      </div>
    </div>
  </div>
</div>
</body>
<script type="module" th:src="@{/js/navbar.js}"></script>
<script type="text/javascript" th:src="@{/js/requestInbox.js}"></script>
</html>
