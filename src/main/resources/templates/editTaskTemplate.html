<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" context="text/html; charset=UTF-8">
  <title>Create New Task</title>
  <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script type="module" src="/js/createTask.js"></script>
</head>
<body>
<div th:replace="fragments/navbar.html :: nav-bar"></div>
<div class="container mt-5">
  <div class="card p-4 shadow-sm">
    <h4 class="card-title mb-4">Edit Task</h4>
    <form th:action="@{/editTask}" method="post" id="create-task-form" th:object="${renovationTaskDTO}" novalidate>


      <input type="hidden" id="renovationId" th:name="renovationId" th:value="${renovation.id}">
      <input type="hidden" id="taskId" th:name="taskId" th:value="${task.getTask_id()}">

      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" placeholder="Enter a name for your task" data-cy="name" autofocus th:field="*{name}">
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description:</label>
        <span id="description-length-counter" class="counter">0/512</span>
        <textarea class="form-control" id="description" placeholder="Enter a description for your task"
                  autofocus th:field="*{description}"></textarea>

        <label for="dueDate" class="form-label">Due Date:</label>
        <input type="date" class="form-control" id="dueDate" th:name="dueDate" th:value="${task.getDueDate()}"
               >
      </div>

      <label class="form-label">Rooms:</label>
      <div class="form-check mb-1 fs-3" th:each="room, meta : ${roomList}">
        <label>
          <input class="form-check-input fs-3" type="checkbox" th:field="${roomList}"
                 th:id="'room-' + ${meta.index}" th:value="${room}"
                 th:checked="${task.getRoomList() != null and #lists.contains(task.getRoomList(), room)}">
        </label>
        <label class="form-check-label fs-3 ml-3" th:for="'room-' + ${meta.index}" th:text="${room}"></label>
      </div>

      <div>
        <table id="room-table" class="table table-striped table-bordered"></table>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>

      <div class="error-label-div">
        <label class="form-label" hidden id="description-error-message">Text gets updated based off error</label>
      </div>
      <div th:if="${errorMessages}" class="alert alert-danger mb-4" role="alert">
        <ul>
          <li th:each="error : ${errorMessages}" th:text="${error}"></li>
        </ul>
      </div>
    </form>
  </div>
  <div class="mt-4">
    <a th:href="@{/renovations/view(id=${renovation.id})}" class="btn  btn-primary">Cancel</a>
  </div>
</div>
</body>
</html>
