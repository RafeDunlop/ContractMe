<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" context="text/html; charset=UTF-8">
  <title>Create New Task</title>
  <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script type="module" src="/js/createTask.js"></script>
</head>
<body>
<div th:replace="fragments/navbar.html :: nav-bar"></div>
<div class="container mt-5">
  <div class="card p-4 shadow-sm">
    <h4 class="card-title mb-4">Edit Task</h4>
    <form action="/create" method="post" id="create-task-form">

      <input type="hidden" id="availableRoomList" name="availableRoomList">
      <input type="hidden" id="renovationId" name="renovationId">

      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" placeholder="Enter a name for your task"
               name="name" data-cy="name" autofocus>
        <div class="error-label-div">
          <label class="form-label" id="name-error-message"></label>
        </div>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description:</label>
        <span id="description-length-counter" class="counter">0/512</span>
        <textarea class="form-control" id="description" placeholder="Enter a description for your task"
                  name="description" autofocus></textarea>
        <div class="error-label-div">
          <label class="form-label" hidden id="description-error-message">Text gets updated based off error</label>
        </div>
      </div>

      <div>
        <label for="roomSelection">Choose a room/s from selection:</label>
        <select name="rooms" id="roomSelection">
          <!--<option disabled selected value=""></option>
          <option value="No available rooms to select" selected disabled hidden></option>-->
        </select>
      </div>

      <div>
        <table id="room-table" class="table table-striped table-bordered"></table>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </div>
  <div class="mt-4">
    <a href="/renovations/view?id=" class="btn  btn-primary">Cancel</a>
  </div>
</div>
</body>
</html>
