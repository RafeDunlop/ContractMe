<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="English">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <base th:href="@{/}"/>
    <title>View Team</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/leaflet/dist/leaflet.css}" rel="stylesheet"/>

  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>


<body>

<div th:replace="~{fragments/confirmPrompt.html :: confirm-prompt}"></div>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>

    <div id="container" class="card container mt-5 p-4 shadow-sm">
        <input type="hidden" id="teamId" th:value="${team.id}">
        <div id="content-header">
            <div class="jumbotron d-flex justify-content-between align-items-center text-center">
                <h1 id="header-title" class="text-black">View Team</h1>
            </div>
        </div>


        <!-- Role Card Display-->

        <div class="container text-center">
            <div class="row">
                <div th:each="role : ${team.getRoles()}" class="col skill-card d-flex justify-content-center">
                    <div class="skill-card-container card container border-black border-5 align-items-center d-flex flex-column position-relative"
                         style="padding-top: 2vh; padding-bottom: 4vh; max-width: 14vw;max-height:500px; margin: 5vh 5% 4vh;">


                        <h5 th:text="${role.getSkill().getDisplayName()}" style="padding-top: 4vh;"></h5>

                        <div  style="width: 100%;"
                             th:styleappend="${(role.getContractorId() != null && role.getStatus().equals(T(nz.ac.canterbury.seng302.homehelper.entity.users.RoleStatus).ACCEPTED))
            ? 'border-color: #8AC926 !important;'
            : (role.getStatus().equals(T(nz.ac.canterbury.seng302.homehelper.entity.users.RoleStatus).WAITING)
                ? 'border-color: black !important;'
                : 'border-color: grey !important;')}" class="border border-2 p-2 mt-2 d-flex flex-column align-items-center">
                        <div th:if="${role.getContractorId() != null}" class="col-md-25  text-center" style="flex: 0 0 18%;">
                            <img th:src="@{'/profile_pictures/' + ${contractors.get(role.getContractorId()).getProfilePicture()}}"
                                 alt="Profile Picture"
                                 class="img-fluid rounded-circle"
                                 style="width: 125%">
                        </div>
                        <div th:if="${role.getContractorId() == null}" class="col-md-25 text-center" style="flex: 0 0 18%;">
                            <img th:src="@{'icons/profile-icon.svg'}"
                                 alt="Profile Picture"
                                 class="img-fluid rounded-circle"
                                 style="max-width: 125px; max-height: 125px; object-fit: cover;">
                        </div>
                        <div>
                            <h5 th:if="${role.getContractorId() != null}" th:text="${contractors.get(role.getContractorId()).getFullName()}"></h5>
                            <h5 th:if="${role.getContractorId() != null && isOwner && (role.getStatus() == null || !role.getStatus().equals(T(nz.ac.canterbury.seng302.homehelper.entity.users.RoleStatus).ACCEPTED))}">
                                Invite Sent!
                            </h5>
                            <div th:if="${role.getContractorId() == null}">
                                <h5 th:if="${team.hasAutomaticFilling()}">No Contractor Found</h5>
                                <button type="button" class="btn btn-primary invite-contractor"
                                        th:unless="${team.hasAutomaticFilling()}"
                                        th:attr="data-skill=${role.getSkill()}">
                                    Invite Contractor
                                </button>
                            </div>
                        </div>
                        <div>
                            <div th:if="${role.contractorId != null && isOwner && !role.getStatus().equals(T(nz.ac.canterbury.seng302.homehelper.entity.users.RoleStatus).UNFILLED)}" th:inline="javascript">
                                <button type="button"
                                        th:attr="data-contractor-id=${role.contractorId}"
                                        id="remove-contractor-button"
                                        class="btn btn-light btn-sm border border-danger text-danger">
                                    Remove Contractor
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
            </div>
        </div>
        <div>
            <a th:href="@{/renovations/view(id=${team.getRenovationRecord().getId()})}" class="btn btn-outline-secondary ms-2">Back</a>
        </div>
    </div>

    <div class="modal fade" id="mapModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Select contractor location</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-0">
            <div id="mapModalMap" style="height:60vh; width:100%"></div>
          </div>
          <div class="modal-footer d-block">
              <button class="btn btn-primary">Confirm</button>
            <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="contractorDetailsMapModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content" style="width: 80%; margin: auto">
                <div class="modal-header">
                    <img id="contractor-profile-picture"
                         src="icons/profile-icon.svg"
                         alt="Contractor Profile Picture"
                         class="rounded-circle img-fluid"
                         style="max-width: 60px; max-height: 60px; object-fit: cover; margin-right: 10px">
                    <h5 id="contractor-name"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <div class="container">
                        <div class="row mb-2">
                            <div class="col-4 fw-bold">Email:</div>
                            <div class="col-8" id="contractor-email"></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4 fw-bold">Phone:</div>
                            <div class="col-8" id="contractor-phone"></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4 fw-bold">Hourly Rate:</div>
                            <div class="col-8" id="contractor-rate"></div>
                        </div>
                        <div class="row mb-2">
                            <div class="col-4 fw-bold">Address:</div>
                            <div class="col-8" id="contractor-address"></div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer d-block">
                    <button class="btn btn-primary">Send Invitation</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

</body>

<script type="text/javascript" th:src="@{/webjars/leaflet/dist/leaflet.js}"></script>
<script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script type="module" th:src="@{/js/confirmPrompt.js}"></script>
<script type="module" th:src="@{/js/navbar.js}"></script>
<script type="module" th:src="@{/js/map/contractorSelectionMap.js}"></script>
<script type="module" th:src="@{/js/deleteContractor.js}"></script>


</html>
