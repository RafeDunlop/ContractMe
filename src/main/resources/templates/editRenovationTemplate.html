<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="English">
<head>
    <th:block th:replace="~{fragments/faviconHeader.html :: faviconHeader}"/>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <base th:href="@{/}"/>
    <title>Edit renovation</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/toggleSwitchStyles.css}"/>
</head>
<body>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div class="container mt-5">

    <div class="card p-4 shadow-sm">
        <h4 class="card-title mb-4">Edit your existing renovation!</h4>
        <form th:action="@{/renovations/edit}" method="post" id="renovation-form">

            <div id="room-hidden-inputs"
                 th:each="room : ${roomList != null ? roomList : (renovation != null ? renovation.rooms : T(java.util.Collections).emptyList())}">
                <input type="hidden" name="roomList" th:value="${room}" />
            </div>

            <input type="hidden" id="existingName" th:name="existingName" th:value="${existingName}">
            <input type="hidden" name="id"
                   th:value="${renovation != null} ? ${renovation.id} : ${id}" />

            <!-- NAME -->
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" class="form-control" id="name" placeholder="Enter a name for your renovation"
                       th:name="name"
                       th:value="${name != null} ? ${name} : ${renovation?.name}" data-cy="name" maxlength="129" autofocus>

                <!-- Frontend JS error -->
                <div class="alert alert-danger mb-4" role="alert" id="name-frontend-error" hidden>
                    <div class="error-box">
                        <ul>
                            <li>
                                <label class="form-label" id="name-frontend-error-message" ></label>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Backend error -->
                <div class="alert alert-danger mb-4" role="alert" id="name-backend-error"  th:attr="hidden=${nameError == null}">
                    <div class="error-box">
                        <ul>
                            <li th:each="msg : ${nameError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- DESCRIPTION -->
            <div class="mb-3">
                <label for="description" class="form-label">Description:</label>
                <span id="description-length-counter" class="counter">0/512</span>
                <textarea class="form-control" id="description" placeholder="Enter a description for your new renovation"
                          th:name="description"
                          th:text="${description != null} ? ${description} : ${renovation?.description}"></textarea>

                <!-- Frontend JS error -->
                <div class="alert alert-danger mb-4" role="alert" id="description-frontend-error" hidden>
                    <div class="error-box">
                        <ul>
                            <li>
                                <label class="form-label" id="description-frontend-error-message" hidden></label>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Backend error -->
                <div class="alert alert-danger mb-4" role="alert" id="description-backend-error" th:attr="hidden=${descriptionError == null}">
                    <div class="error-box">
                        <ul>
                            <li th:each="msg : ${descriptionError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- ROOM LIST -->
            <div class="mb-3">
                <div class="input-group">
                    <input type="text" class="form-control" id="roomList" placeholder="Enter a room name"
                           th:name="renovation.rooms" data-cy="roomList" aria-label="roomList">
                    <button type="button" class="btn btn-primary" id="create-room-button">Add Room</button>
                </div>

                <!-- Frontend JS error -->
                <div class="alert alert-danger mb-4" role="alert" id="room-frontend-error" hidden>
                    <div class="error-box">
                        <ul>
                            <li>
                                <label class="form-label" id="room-frontend-error-message" hidden></label>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- Backend error -->
                <div class="alert alert-danger mb-4" role="alert" id="room-backend-error" th:attr="hidden=${roomError == null}">
                    <div class="error-box">
                        <ul>
                            <li th:each="msg : ${roomError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>

                <table id="room-list" class="table table-bordered"></table>
            </div>

            <!-- LOCATION TOGGLE SWITCH -->


            <div class="d-flex justify-content-between align-items-center py-4 px-0" style="width: 25%">
                <div>Enter Location (Optional):</div>
                <div>
                    <label class="switch">
                        <input type="checkbox" id="location-toggleswitch" th:checked="${locationUsed}">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <!-- LOCATION FORM FRAGMENT -->
            <div th:class="'pb-3 ' + (${locationUsed} ? 'form-extension' : 'hidden-form-extension')" id="location-form">
                <div th:replace="~{fragments/locationForm.html :: locationForm(
                     addressDTO=${addressDTO})}"></div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary" id="submit-record">Submit</button>
                <a th:href="@{/renovations/view(id=${renovation.id})}" class="btn btn-outline-secondary ms-3">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
<script type="module" th:src="@{/js/navbar.js}"></script>
<script type="module" th:src="@{/js/locationForm.js}"></script>
<script type="module" th:src="@{/js/validation/renovationValidations.js}"></script>
<script type="module" th:src="@{/js/individualRenovation.js}"></script>
<script type="module" th:src="@{/js/locationToggleSwitch.js}"></script>
</html>
