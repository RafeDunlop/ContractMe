<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="English">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>Home Helper Registration</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <link rel="stylesheet" th:href="@{/css/toggleSwitchStyles.css}"/>
</head>

<style>
    .col-md-25 {
        flex: 0 0 18%;
        max-width: 22%;
    }
</style>
<body>
<div class="container mt-5">
    <div class="card p-4 shadow">
        <h4 class="card-title mb-5">Sign up</h4>
        <form th:action="@{register}" method="post" id="registration-form">
            <div class="form-group mb-3">

                <!-- FIRST NAME -->
                <div class="mb-3">
                    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="First Name"
                           aria-label="first-name" th:value="${userRegisterDTO.firstName}">

                    <!-- Frontend JS error -->
                    <div class="alert alert-danger mt-2" id="firstName-frontend-error" hidden>
                        <ul>
                            <li><label class="form-label" id="firstName-frontend-error-message"></label></li>
                        </ul>
                    </div>

                    <!-- Backend error -->
                    <div class="alert alert-danger mt-2" id="firstName-backend-error"
                         th:attr="hidden=${firstNameError == null}">
                        <ul>
                            <li th:each="msg : ${firstNameError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>

                <!-- LAST NAME -->
                <div class="mb-3">
                    <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Last Name"
                           aria-label="last-name" th:value="${userRegisterDTO.lastName}">

                    <!-- Frontend JS error -->
                    <div class="alert alert-danger mt-2" id="lastName-frontend-error" hidden>
                        <ul>
                            <li><label class="form-label" id="lastName-frontend-error-message"></label></li>
                        </ul>
                    </div>

                    <!-- Backend error -->
                    <div class="alert alert-danger mt-2" id="lastName-backend-error"
                         th:attr="hidden=${lastNameError == null}">
                        <ul>
                            <li th:each="msg : ${lastNameError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="mb-3">
                    <input type="text" class="form-control" id="email" name="email" placeholder="Email"
                           aria-label="email" th:value="${userRegisterDTO.email}">

                    <!-- Frontend JS error -->
                    <div class="alert alert-danger mt-2" id="email-frontend-error" hidden>
                        <ul>
                            <li><label class="form-label" id="email-frontend-error-message"></label></li>
                        </ul>
                    </div>

                    <!-- Backend error -->
                    <div class="alert alert-danger mt-2" id="email-backend-error"
                         th:attr="hidden=${emailError == null}">
                        <ul>
                            <li th:each="msg : ${emailError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>

                <!--&lt;!&ndash; Location toggle switch &ndash;&gt;
                <div>
                    <table class="border border-0">
                        <tr>
                            <th class="p-4">Enter Location (Optional):</th>
                            <th>
                                <div class="mb-3">
                                    <label class="switch">
                                        <input type="checkbox" id="location-toggleswitch">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </th>
                        </tr>
                    </table>
                </div>-->

                <button type="button" class="btn btn-primary" id="location-button">Add/Edit Location (Optional)</button>

                <!-- LOCATION FORM FRAGMENT -->

                <div class="shadow-overlay" id="location-form">
                    <div th:replace="~{fragments/locationForm.html :: locationForm(
                    submissionEndpoint='register', locationDTO=${locationDTO})}"></div>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Password"
                           aria-label="password">

                    <!-- Frontend JS error -->
                    <div class="alert alert-danger mt-2" id="password-frontend-error" hidden>
                        <ul>
                            <li><label class="form-label" id="password-frontend-error-message"></label></li>
                        </ul>
                    </div>

                    <!-- Backend error -->
                    <div class="alert alert-danger mt-2" id="password-backend-error"
                         th:attr="hidden=${passwordError == null}">
                        <ul>
                            <li th:each="msg : ${passwordError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="mb-5">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                           placeholder="Confirm Password" aria-label="confirm-password">

                    <!-- Frontend JS error -->
                    <div class="alert alert-danger mt-2" id="confirmPassword-frontend-error" hidden>
                        <ul>
                            <li><label class="form-label" id="confirmPassword-frontend-error-message"></label></li>
                        </ul>
                    </div>

                    <!-- Backend error -->
                    <div class="alert alert-danger mt-2" id="confirmPassword-backend-error"
                         th:attr="hidden=${confirmPasswordError == null}">
                        <ul>
                            <li th:each="msg : ${confirmPasswordError}" th:text="${msg}"></li>
                        </ul>
                    </div>
                </div>

                <!-- General error messages -->
                <div th:if="${errorMessages}" class="alert alert-danger mb-4" role="alert">
                    <ul>
                        <li th:each="error : ${errorMessages}" th:text="${error}"></li>
                    </ul>
                </div>

                <!-- SIGN UP BUTTON -->
                <button type="submit" class="btn btn-primary">Sign up</button>

                <!-- CANCEL BUTTON -->
                <a th:href="@{/}" class="btn btn-outline-secondary m-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
<script type="module" src="/js/locationForm.js"></script>
<script type="module" src="/js/userValidation.js"></script>
<script type="module" src="/js/registerValidation.js"></script>
</html>
