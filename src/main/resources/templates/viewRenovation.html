<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>View Renovation</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <style>
        .task-icon {
            width: 30px;  /* Adjust icon size */
            height: 30px;
        }

        .truncate {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .truncate:hover {
            overflow: hidden;
            white-space: normal;
            word-wrap: break-word;
            max-width: 100%;
            background-color: #f8f9fa;
            border-radius: 5px;
            padding: 5px;
            -webkit-line-clamp: unset;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div class="container mt-5">

    <div class="card p-4 shadow-sm">
        <h4 th:text="'Viewing Renovation: ' + ${renovation.name}" class="card-title mb-4"></h4>


        <div th:if="${description} != ''" class="card p-3 bg-light mb-3">
            <h6 class="fw-bold">Description:</h6>
            <p class="mb-0" th:text="${renovation.description}"></p>
        </div>

        <div th:if="!${renovation.rooms.isEmpty()}" class="mb-3">
            <h6 class="fw-bold">Rooms:</h6>
            <div class="list-group">
                <div th:each="room : ${renovation.rooms}" class="list-group-item">
                    🛠️ <span th:text="${room}" class="ms-2"></span>
                </div>
            </div>
        </div>

        <div th:if="!${renovation.getRenovationTasks().isEmpty()}" class="mb-3">
            <h6 class="fw-bold">Tasks:</h6>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3">
                <div th:each="renovationTask : ${renovation.getRenovationTasks()}" class="col mb-4">
                    <div class="card" style="width: 18rem;">
                        <div class="card-body">
                            <div class="d-flex align-items-center">
                                <img th:src="@{/images/task-icon.png}" alt="Task Icon" class="task-icon">
                                <h5 class="card-title truncate ms-2 mb-0" th:text="${renovationTask.getName()}">Task Title</h5>
                            </div>
                            <p class="card-text truncate" th:text="${renovationTask.getDescription()}">Task Description</p>
                            <p class="card-text"><strong>Due Date:</strong> <span th:text="${renovationTask.getDueDate()}">Due Date</span></p>
                            <div class="d-flex justify-content-between">
                                <a th:href="@{/editTask(taskId=${renovationTask.getTask_id()},renovationId=${renovation.getId()})}" class="btn btn-primary">Edit</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="mt-4 mb-4">
        <a th:href="@{/renovations/edit(id=${renovation.id})}" class="btn btn-primary">Edit</a>
        <a th:href="@{/renovations/view/create(id=${renovation.id})}" class="btn btn-primary">Add New Task</a>
        <a th:href="@{/renovations}" class="btn btn-primary">Back To Renovations</a>
    </div>
</div>

</body>
</html>
