<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>View renovation</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div th:replace="~{fragments/confirmPrompt.html :: confirm-prompt}"></div>
<div class="container mt-5">

    <input type="hidden" id="data-total-pages" th:value="${totalPages}" aria-label="Total number pages"/>
    <div class="card p-4 shadow-sm">
        <h4 th:text="'Viewing Renovation: ' + ${renovation.name}" class="card-title mb-4"></h4>
        <div th:if="${description} != ''" class="card p-3 bg-light mb-3">
            <p class="mb-0" th:text="${renovation.description}"></p>
        </div>

        <div th:if="!${renovation.rooms.isEmpty()}" class="mb-3">
            <h6 class="fw-bold">Rooms:</h6>
            <ul class="list-group">
                <li th:each="room : ${renovation.rooms}" class="list-group-item">
                    🛠️ <span th:text="${room}" class="ms-2"></span>
                </li>
            </ul>
        </div>

        <div th:if ="!${renovation.getRenovationTasks().isEmpty()}" class="mb-3">
            <h6 class = "fw-bold">Tasks:</h6>
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Rooms</th>
                <th>Due Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td><a th:text="${task.getName()}">Name</a></td>
                <td><a th:text="${task.getDescription()}">Description</a></td>
                <td><a th:text="${task.getRoomList()}">Rooms</a></td>
                <td><a th:text="${task.getDueDate()}">Due Date</a></td>
<!--                    <button type="button" class="btn btn-outline-danger custom-light-border"-->
<!--                            th:attr="data-id=${renovation.id}, data-searchQuery=${searchQuery}, data-csrf=${_csrf.token}"-->
<!--                            th:onclick="|confirmDelete(this)|">-->
<!--                        ❌-->
<!--                    </button>-->
            </tr>
            </tbody>
        </table>
        </div>
        <div class="d-flex justify-content-center" th:if="${totalPages > 0}">
            <ul class="pagination" id="pagination">
                <!-- First button (AC more than 10 pages) --> <!-- CHANGE IF TO 10 after testing  CHANGE LOGIC WITH HIDING-->
                <li class="page-item" th:if="${totalPages > 10}">
                    <a class="page-link" href="#" th:href="@{/renovations/view(id=${renovation.id}, page=1)}">First</a>
                </li>

                <!-- Previous button -->
                <li class="page-item" th:if="${pageNumber > 1}">
                    <a class="page-link" href="#" th:href="@{/renovations/view(id=${renovation.id}, page=${pageNumber - 1})}">Prev</a>
                </li>

                <!-- Page buttons <= 10 Pages, AC3 -->
                <li class="page-item" th:if="${totalPages <= 10}" th:each="pageLinkNumber : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${pageLinkNumber == pageNumber} ? 'active'">
                    <a class="page-link" th:href="@{/renovations/view(id=${renovation.id}, page=${pageLinkNumber})}" th:text="${pageLinkNumber}"></a>
                </li>

                <!-- Page buttons > 10 Pages, AC3 -->
                <li class="page-item" th:if="${totalPages > 10}"
                    th:each="pageLinkNumber : ${#numbers.sequence(paginationLinksStart, paginationLinksEnd)}"
                    th:classappend="${pageLinkNumber == pageNumber} ? 'active'">
                    <a class="page-link" th:href="@{/renovations/view(id=${renovation.id}, page=${pageLinkNumber})}" th:text="${pageLinkNumber}"></a>
                </li>

                <!-- Next button -->
                <li class="page-item" th:if="${pageNumber < totalPages}">
                    <a class="page-link" href="#" th:href="@{/renovations/view(id=${renovation.id}, page=${pageNumber} + 1)}">Next</a>
                </li>

                <!-- Last button (AC more than 10 pages) --> <!-- CHANGE IF TO 10 after testing  CHANGE LOGIC WITH HIDING-->
                <li class="page-item" th:if="${totalPages > 10}">
                    <a class="page-link" href="#" th:href="@{/renovations/view(id=${renovation.id}, page=${totalPages})}">Last</a>
                </li>


                <!-- Search field (AC more than 10 pages) --> <!-- CHANGE IF TO 10 after testing -->
                <li class="page-item d-flex align-items-center" th:if="${totalPages > 10}">
                    <input type="number" class="form-control me-2" id="pageSearch" aria-label="Page Search">
                    <button class="btn btn-primary" th:onclick="|validatePageSearch(${renovation.id})|">Search</button>
                </li>
            </ul>
        </div>
    </div>

    <div class="alert alert-danger" id="errorMessage" style="margin-top: 20px; display: none;">
        <p id="errorText"></p>
    </div>

    <div class="mt-4">
        <a th:href="@{/renovations/edit(id=${renovation.id})}" class="btn  btn-primary">Edit</a>
        <a th:href="@{/renovations/view/create(id=${renovation.id})}" class="btn btn-primary">Add new task</a>
        <a th:href="@{/renovations}" class="btn  btn-primary">Back To Renovations</a>
    </div>
</div>

</body>
<script type="text/javascript" th:src="@{/js/confirmPrompt.js}"></script>
<script type="text/javascript" th:src="@{/js/pagination.js}"></script>
</html>
