<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="English">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <base th:href="@{/}"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <title>View Renovation</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/viewRenovationStyles.css}">
    <link rel="stylesheet" th:href="@{/css/tags.css}">
    <link rel="stylesheet" th:href="@{/css/maps.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/leaflet/dist/leaflet.css}"/>
</head>
<body>

    <div th:replace="~{fragments/navbar.html :: nav-bar}"></div>


    <div id="container" class="card container mt-5 shadow-sm">
        <input type="hidden" id="pageNumber" th:value="${pageNumber}" name="page"/>
        <input type="hidden" id="totalPages"/>
        <input type="hidden" id="cardsPerPage"/>
        <input type="hidden" id="isOwner" th:value="${isOwner}"/>
        <input type="hidden" name="previousUrl" th:value="${previousUrl}"/>
        <input type="hidden" id="record" th:value="${renovation}"/>
        <input type="hidden" id="recordId" th:value="${renovation.id}"/>
        <input type="hidden" id="icons" th:value="${icons}"/>

        <!-- Backend error message for algorithm response-->
        <div class="alert alert-danger mt-2" role="alert" id="team-backend-error"
             th:if="${response != null and response == false}">
            <label>Unable to find any matching contractors for this team.</label>
        </div>

        <!-- Backend success message for algorithm response-->
        <div class="alert alert-success mt-2" role="alert" id="team-backend-success"
             th:if="${response != null and response == true}">
            <label>Contractors assigned to team successfully.</label>
        </div>

        <div id="content-container">

            <div id="renovation-name-header" class="renovation-name-header px-3 pt-3">

                <div class="row align-items-center mb-4">
                    <h1 th:text="${renovation.name}"
                        class="text-truncate col"
                        style="overflow: hidden; white-space: nowrap; text-overflow: ellipsis;"
                        title="[[${renovation.name}]]">
                    </h1>
                    <form id="renovationForm" class="col-auto mx-auto" th:if="${isOwner}">
                        <input type="checkbox" id="publicCheckbox" name="isPublic" th:checked="${renovation.isPublic()}" class="me-1">
                        <label for="publicCheckbox" class="mb-0">Make my renovation record public</label>
                    </form>
                </div>

                <div class="row align-items-center mb-4">
                    <ul class="nav nav-tabs renovation-tab-bar col">
                        <li class="nav-item">
                            <button id="details-tab-item" class="nav-link renovation-tab-bar-options" th:classappend="${tabBarFocus == 'details'} ? ' active'">Details</button>
                        </li>
                        <li class="nav-item">
                            <button id="tasks-tab-item" class="nav-link renovation-tab-bar-options" th:classappend="${tabBarFocus == 'tasks'} ? ' active'">Tasks</button>
                        </li>
                        <li class="nav-item">
                            <button id="calendar-tab-item" class="nav-link renovation-tab-bar-options" th:classappend="${tabBarFocus == 'calendar'} ? ' active'">Calendar</button>
                        </li>
                        <li class="nav-item">
                            <button id="view-location-tab-item" class="nav-link renovation-tab-bar-options" th:classappend="${tabBarFocus == 'view-location'} ? ' active'">View Location</button>
                        </li>
                    </ul>
                    <div th:if="${isOwner}" class="col-auto mx-auto">
                        <!-- Create button for location and no team -->
                        <a th:href="@{/renovations/team/create(id=${renovation.id})}" class="btn btn-primary" id="create-team-button" th:if="${hasLocation && !hasTeam && isOwner}">Create Team</a>
                        <span class="align-self-center" th:unless="${hasLocation}" th:text="|Add a location to create a team|"></span>

                        <a th:href="@{/renovations/team/view(id=${teamId})}" class="btn btn-primary" th:if="${hasTeam && (isOwner || isContractorAssignedToTeam)}">View Team</a>


                        <!-- Team exists, delete team -->
                        <div class="d-inline-flex align-items-center ms-2" th:if="${hasTeam && isOwner}">
                            <div id="delete-team-div" class="d-inline">
                                <button type="button" id="delete-team-button" class="btn btn-outline-danger"
                                        th:attr="data-csrf=${_csrf.token}, data-id=${teamId}" aria-label="Delete team">Delete Team</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RENOVATION DETAILS PAGE-->
            <div id="details-content" class="renovation-content" th:style="${tabBarFocus != 'details'} ? 'display: none;'">
                <div th:if="${renovation.description} != ''" class="card p-3 bg-light mt-4 mb-3">
                    <h6 class="fw-bold">Description:</h6>
                    <p class="mb-0" th:text="${renovation.description}"></p>
                </div>

                <div th:if="${hasLocation}" class="mb-3">
                    <div th:replace="~{fragments/addressDisplay.html :: addressDisplay (${renovation.getLocation()})}"></div>
                </div>

                <div th:if="!${renovation.rooms.isEmpty()}" class="mb-3">
                    <h6 class="fw-bold">Rooms:</h6>
                    <div class="list-group">
                        <div th:each="room : ${renovation.rooms}" class="list-group-item">
                            🛠️ <span th:text="${room}" class="ms-2"></span>
                        </div>
                    </div>
                </div>

                <!-- Single Tag Add Form -->
                <form th:action="@{/renovations/tags/add}" method="post" id="add-tag-form" class="mb-3" th:if="${isOwner}">
                    <label for="tagName" class="fw-bold h6">Add Tags:</label>
                    <input type="text" class="form-control" id="tagName" name="tagName" placeholder="Enter a tag"
                           data-cy="tag" maxlength="129" autocomplete="off" th:value="${submittedTag} ?: ''" required>
                    <ul id="autocomplete-list" class="list-group position-absolute" style="z-index: 1000;"></ul>
                    <input type="hidden" name="renovationId" th:value="${renovation.id}">
                </form>

                <!-- Frontend JS error -->
                <div class="alert alert-danger mt-2" role="alert" id="tag-frontend-error" hidden>
                    <ul><li><label class="form-label" id="tag-frontend-error-message"></label></li></ul>
                </div>
                <!-- Backend error -->
                <div class="alert alert-danger mt-2" role="alert" id="tag-backend-error"
                     th:attr="hidden=${errors == null}">
                    <ul><li th:each="msg : ${errors}" th:text="${msg}"></li></ul>
                </div>

                <!-- Display added tags -->
                <div id="tagList" class="mb-3">
                    <h6 class="fw-bold d-block mb-1">Current Tags:</h6>
                    <span th:each="tag : ${renovation.getSortedTags()}" class="tag-box badge bg-success d-inline-flex align-items-center me-2 mb-2">
                    <span class="tag-text-large text-truncate ms-1" th:text="${tag.getTagName()}"></span>
                    <button class="tag-delete-button-large btn-sm border-0 bg-transparent text-light ms-1"
                            th:if="${isOwner}" type="button"
                            th:attr="data-renovationId=${renovation.id}, data-csrf=${_csrf.token}, data-tagName=${tag.getTagName()}"
                            th:onclick="|removeTag(this)|">
                        X
                    </button>
                </span>
                </div>

                <p class="text-muted mb-3" th:if="${renovation.getSortedTags().isEmpty()}">
                    No tags have been added yet.
                </p>


                <!-- Button section for details tab, has -->
                <div class="mt-2 mb-4 d-flex">
                    <a th:href="@{/renovations/edit(id=${renovation.id})}" class="btn btn-primary" th:if="${isOwner}">Edit</a>
                    <a th:href="@{${previousUrl}}" class="btn btn-outline-secondary ms-3" th:if="${previousUrl != null && !previousUrl.contains('/search')}">Back</a>
                    <a th:href="@{${previousUrl}}" class="btn btn-outline-secondary ms-3" th:if="${previousUrl.contains('/search')}">Back to search results</a>
                </div>

            </div>

            <!-- TASK PAGE -->
            <div id="tasks-content" class="renovation-content"  th:style="${tabBarFocus != 'tasks'} ? 'display: none;'">
                <div class="col-md-12 mt-4 mb-3 d-flex align-items-end gap-4">
                    <div>
                        <label for="status-filter" class="fw-bold">Task State:</label>
                        <select id="status-filter" name="status" class="form-select"
                                th:attr="onchange=|fetchRenovation(${renovation.id})|">
                            <option value="all" th:selected="${status == 'all'}">All</option>
                            <option value="notStarted" th:selected="${status == 'notStarted'}">Not Started</option>
                            <option value="inProgress" th:selected="${status == 'inProgress'}">In Progress</option>
                            <option value="blocked" th:selected="${status == 'blocked'}">Blocked</option>
                            <option value="completed" th:selected="${status == 'completed'}">Completed</option>
                            <option value="cancelled" th:selected="${status == 'cancelled'}">Cancelled</option>
                        </select>
                    </div>
                    <div>
                        <a th:href="@{/renovations/view/create(id=${renovation.id})}" class="btn btn-primary" th:if="${isOwner}">Add New Task</a>
                    </div>
                </div>
                <!-- Add New Task Button -->

                <div id="content-header">
                </div>

                <div th:if="${not #lists.isEmpty(renovation.getRenovationTasks())}" id="elements-container" style="display: none;">
                    <div id="grid" class="task-grid">
                        <!-- Cards will be injected here by JavaScript -->
                    </div>
                </div>

                <div id="footer" class="mt-2">
                    <div class="d-flex justify-content-center">
                        <ul class="pagination" id="pagination"></ul>
                    </div>

                    <div class="alert alert-danger" id="errorMessage" style="margin-top: 20px; display: none;">
                        <p id="errorText"></p>
                    </div>
                </div>
            </div>

            <!-- CALENDAR PAGE -->
            <div id="calendar-content" class="renovation-content" th:style="${tabBarFocus != 'calendar'} ? 'display: none;'">
                <div class="my-4" th:if="${isOwner}">
                    <div th:replace="~{fragments/calendar.html ::calendar (${date}, ${datesArray}, ${renovation.id})}"></div>
                </div>
            </div>

            <!-- VIEW LOCATION PAGE -->
            <div id="view-location-content" class="renovation-content" th:style="${tabBarFocus != 'view-location'} ? 'display: none;'" style="justify-content: center;">
                <div class="d-flex justify-content-center m-5">
                    <div id="renovation-map" class="contractme-map"></div>
                </div>
            </div>

        </div>
    </div>

    <div id="icon-selector-modal" class="modal" style="display: none">
        <div id="icon-selector-content"></div>
    </div>

    <div class="modal fade" id="task-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div id="task-modal-content" class="modal-content"></div>
        </div>
    </div>

    <input type="hidden" id="renovation" th:value="${renovationId}"/>

    <script th:inline="javascript">
    const allIcons = /*[[${icons}]]*/ [];
</script>

</body>


<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", () => {
        const recordId = document.getElementById("recordId")?.value;

        if (!recordId) {
            console.error("Record ID not found");
            return;
        }

        updateLayout("cards", recordId);

        window.addEventListener('resize', () => {
            clearTimeout(window._resizeTimeout);
            cachedCardSize = null;
            window._resizeTimeout = setTimeout(() => updateLayout("cards", recordId), 400);
        });
    });
</script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
<script th:src="@{/js/addTaskIcon.js}"></script>
<script type="module" th:src="@{/js/navbar.js}"></script>
<script type="text/javascript" th:src="@{/js/renovationPublicity.js}"></script>
<script type="module" th:src="@{/js/confirmPrompt.js}"></script>
<script type="text/javascript" th:src="@{/js/pagination.js}"></script>
<script type="module" th:src="@{/js/autocomplete.js}"></script>
<script type="text/javascript" th:src="@{/js/validation/renovationTagValidation.js}"></script>
<script type="text/javascript" th:src="@{/js/removeTag.js}"></script>
<script type="text/javascript" th:src="@{/js/renovationUtils.js}"></script>
<script type="text/javascript" th:src="@{/js/calendar.js}"></script>
<script type="text/javascript" th:src="@{/js/taskState.js}"></script>
<script type="module" th:src="@{/js/deleteTeam.js}"></script>
<script type="module" th:src="@{/js/viewRenovationTabBar.js}"></script>
<script th:src="@{/webjars/leaflet/dist/leaflet.js}"></script>
<script type="module" th:src="@{/js/map/renovationMap.js}"></script>
</html>
