<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
  <title>Home Helper Forgot Password</title>
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
  <div class="card p-4 shadow">
    <h4 class="card-title mb-5">Reset your password</h4>
      <form th:action="@{/password/forgot}" method="post">

        <!-- EMAIL -->
        <div class="mb-3">
          <div class="mb-3">
            <input type="text" class="form-control" id="email" name="email"
                   placeholder="Email" th:value="${email}" aria-label="Email">

            <!-- Frontend JS error -->
            <div class="alert alert-danger mt-2" role="alert" id="email-frontend-error" hidden>
              <ul><li><label class="form-label" id="email-frontend-error-message"></label></li></ul>
            </div>

            <!-- Backend error -->
            <div class="alert alert-danger mt-2" role="alert" id="email-backend-error" th:if="${emailError}">
              <ul><li th:each="msg : ${emailError}" th:text="${msg}"></li></ul>
            </div>
          </div>
        </div>

        <div th:if="${emailMessage}" class="alert alert-success mb-4" role="alert">
          <ul>
            <li th:text="${emailMessage}"></li>
          </ul>
        </div>

        <!-- SUBMIT BUTTON -->
        <button type="submit" class="btn btn-primary">Submit</button>

        <!-- CANCEL BUTTON -->
        <a th:href="@{/login}" class="btn btn-outline-secondary m-4">Cancel</a>
      </form>
  </div>
</div>

</body>
<script type="module" th:src="@{/js/userValidation.js}"></script>
<script type="module" th:src="@{/js/forgotPasswordValidation.js}"></script>
</html>
