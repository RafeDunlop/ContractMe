<div th:fragment="formField (field, value, size)">
    <div class="mb-3">
        <label th:for="${#strings.toLowerCase(field)}" class="form-label">
            <span th:text="${field}">Field</span>
        </label>
        <input type="text"
               th:id="${#strings.toLowerCase(field)}"
               th:name="${#strings.toLowerCase(field)}"
               th:value="${value}"
               th:size="${size}"
               class="form-control" />
    </div>
</div>
