<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <title>Log in</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>
    <div class="container mt-5">
        <div class="card p-4 shadow">
            <h4 class="card-title mb-5">Log in</h4>
            <form th:action="@{/login}" method="post">
                <div class="form-group mb-3">
                    <div class="mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Email" aria-label="Email">
                    </div>
                    <div class="mb-3">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" aria-label="Password">
                    </div>
                    <div th:if="${errorMessage}"  class="alert alert-danger mb-4" role="alert">
                        <ul>
                            <li th:each="error : ${errorMessage}" th:text="${error}"></li>
                        </ul>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                    <a th:href="@{/}" class="btn btn-outline-secondary m-4">Cancel</a>
                    <a th:href="@{/register}" class="btn btn-link">Not registered? Create an account</a>
                    <a th:href="@{/password/forgot}" class="btn btn-link">Forgot your password?</a>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
