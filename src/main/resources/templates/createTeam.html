<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="English">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <base th:href="@{/}"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <title>Create Team</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div th:replace="~{fragments/confirmPrompt.html :: confirm-prompt}"></div>

<div id="container" class="card container mt-5 p-4 shadow-sm">
    <h4 class="card-title mb-4" th:text="|Create Team For ${renovationRecord.getName()}|"/>

    <form th:action="@{/renovations/team/create(id=${renovationRecord.id})}" method="post" id="create-team-form" th:object="${teamRequestDTO}" novalidate>
        <input type="hidden" id="automatic-invite" value="true" name="invitesAutomatic" th:field="*{invitesAutomatic}"/>
        <div class="input-group mb-3">
            <select class="form-select" id="skills-select" type="text" aria-label="skills-select" autocomplete="off" onchange="addSkill()">
                <option disabled selected hidden>Select Role</option>
                <option th:each="skill : ${skills}" th:value="${skill}" th:text="${skill.getDisplayName()}"
                        th:attr="data-displayname=${skill.getDisplayName()}" class="skill-option"></option>
            </select>
        </div>

        <!-- Role Card Display-->
        <div class="container text-center">
            <div class="row">
                <div th:each="skill : ${teamRequestDTO.skills}" class="col skill-card">
                    <div class="card container border-5 border-dark-subtle align-items-center position-relative skill-card-container"
                         style="padding-top: 7vh; padding-bottom: 7vh; max-width: 14vw; height: 35vh; margin: 5vh 5% 4vh;">

                        <!-- Delete button (hidden by default, shows on hover) -->
                        <button type="button" class="btn btn-sm btn-danger delete-skill-btn">✖</button>

                        <h3 th:text="${#strings.capitalize(skill.replace('_', ' ').toLowerCase())}">skill</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Frontend JS error -->
        <div class="alert alert-danger mt-2" role="alert" id="skill-frontend-error" hidden>
            <ul><li><label class="form-label" id="skill-frontend-error-message"></label></li></ul>
        </div>
        <!-- Backend error -->
        <div class="alert alert-danger mt-2" role="alert" id="skill-backend-error"
             th:attr="hidden=${errors == null}">
            <ul><li th:each="msg : ${errors}" th:text="${msg}"></li></ul>
        </div>

        <div>
            <input type="submit" id="form-submit" onclick="confirmTeamRequest(event)" class="btn btn-primary mt-5 me-2" value="Submit" />
            <a th:href="@{/renovations/view(id=${renovationRecord.id})}" class="btn btn-outline-secondary mt-5">Back</a>
        </div>
    </form>
</div>
</body>
<script type="module" th:src="@{/js/confirmPrompt.js}"></script>
<script type="module" th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/createTeam.js}"></script>
<script th:src="@{/js/validation/createTeamValidation.js}"></script>

</html>
