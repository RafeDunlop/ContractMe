<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
  <title>Update Password</title>
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
  <div class="card p-4 shadow">
    <h4 class="card-title mb-5">Update Password</h4>
    <form th:action="@{/user/edit}" method="post" th:object="${updatePasswordDTO}">
      <div class="form-group mb-3">
        <div class="mb-3">
          <input type="password" class="form-control" id="old-password" name="oldPassword" placeholder="Old Password" aria-label="old-password" th:field="*{currentPassword}" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" id="new-password" name="newPassword" placeholder="New Password" aria-label="new-password" th:field="*{newPassword}" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" id="new-password-retyped" name="newPasswordRetyped" placeholder="Retype New Password" aria-label="retype-new-password" th:field="*{retypePassword}" required>
        </div>
        <div th:if="${errorMessages}" class="alert alert-danger mb-4" role="alert">
          <ul>
            <li th:each="error : ${errorMessages}" th:text="${error}"></li>
          </ul>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/user}" class="btn btn-outline-secondary m-2">Cancel</a>
          </div>
          <div>
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
</body>
</html>
