<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="English">
<body>
<!-- month is the month name, numDays is the number of days in the month, rows is the number of rows in the calendar,
and firstDay is the number of the day of the Week which occurs on the first day of the month,
from 0 (Monday) to 6 (Sunday) -->
<div th:fragment="calendar (date, dates)" class="container" id="calendar">
    <div class="row">
        <div class="col">
            <h1 class="display-5 text-center" th:text="|${#calendars.monthName(date)} ${#calendars.year(date)}|"></h1>
        </div>
    </div>
    <div class="row text-center">
        <div class="col border border-secondary">Monday</div>
        <div class="col border border-secondary">Tuesday</div>
        <div class="col border border-secondary">Wednesday</div>
        <div class="col border border-secondary">Thursday</div>
        <div class="col border border-secondary">Friday</div>
        <div class="col border border-secondary">Saturday</div>
        <div class="col border border-secondary">Sunday</div>
    </div>

    <!-- Sets variables for the current date, changes bg color if cell is today's date -->
    <div th:each="row : ${dates}" class="row"
         th:with="
         currentDay=${#dates.day(#dates.createNow())},
         currentMonth=${#dates.month(#dates.createNow())},
         currentYear=${#dates.year(#dates.createNow())}
     ">
        <div th:each="cell : ${row}"
             th:if="${cell != null}"
             class="col py-5 border border-secondary text-start"
             th:text="${cell.day}"
             th:classappend="${cell.month != #calendars.month(date)} ? ' bg-body-secondary text-muted' : ''"
             th:style="${(cell.day == currentDay and cell.month == currentMonth and #calendars.year(date) == currentYear) ? 'background-color: #ffff99;' : ''}">
        </div>
    </div>

</div>
</body>
</html>
