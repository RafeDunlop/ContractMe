<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="English">
<body>
<!-- month is the month name, numDays is the number of days in the month, rows is the number of rows in the calendar,
and firstDay is the number of the day of the Week which occurs on the first day of the month,
from 0 (Monday) to 6 (Sunday) -->
<div th:fragment="calendar (month, numDays, rows, firstDay)" class="container">
    <h1 class="display-5 text-center">${month}</h1>
    <div th:each="row: ${#numbers.sequence(0, rows)}" class="row">
        <div th:each="prevDay: ${#numbers.sequence(0, firstDay)}" class="col bg-secondary"></div>
        <div th:each="day : ${#numbers.sequence(1, numDays + 1)}" class="col">
            <p class="text-start">${day}</p>
        </div>
    </div>
</div>
</body>
</html>
