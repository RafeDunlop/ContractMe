<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="English">
<head th:fragment="headerfiles">
    <meta charset="UTF-8"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <title>Home Helper navigation bar</title>
</head>
<body>
<div th:fragment="nav-bar">
<div class="container mt-5">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/main}">Home</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/user}">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/renovations}">My Renovations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/renovations/search?visibility='user'}">Search My Renovations</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/renovations/search?visibility='public'}">Browse Renovations</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</div>
</body>
</html>
