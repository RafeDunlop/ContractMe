<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="English">
<head th:fragment="headerfiles">
    <meta charset="UTF-8"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <title>Contractme confirmation popup</title>
</head>

<body>
<div th:fragment="confirm-prompt">
    <div id="overlay" th:class="shadow-overlay">
        <div class="container d-flex justify-content-center align-items-center vh-100">
            <div class="card p-4 shadow-sm">
                <h4 id="promptTitle"></h4>
                <p id="promptText"></p>
                <div class="d-flex justify-content-between mx-3">
                    <button id="confirmButton" class="btn btn-danger m-3 h-5"></button>
                    <button id="cancelButton" class="btn btn-outline-secondary m-3 h-5"></button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
