<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <title></title>
</head>
<body>
<div th:fragment="locationForm (addressDTO)">

    <div>

        <!-- ADDRESS (house number and street)-->
        <div class="mb-3">
            <input type="text" class="form-control" id="address" name="address_line1" placeholder="Address"
                   aria-label="address" th:value="${addressDTO.address_line1}">

            <!-- Frontend JS Error -->

            <!-- Backend error -->
        </div>

        <!-- SUBURB -->
        <div class="mb-3">
            <input type="text" class="form-control" id="suburb" name="region" placeholder="Suburb (optional)"
                   aria-label="suburb" th:value="${addressDTO.region}">

            <!-- Frontend JS Error -->
            <div class="alert alert-danger mt-2" id="suburb-frontend-error" hidden>
                <ul>
                    <li><label class="form-label" id="suburb-frontend-error-message"></label></li>
                </ul>
            </div>

            <!-- Backend error -->
            <div class="alert alert-danger mt-2" id="suburb-backend-error"
                 th:attr="hidden=${suburbError == null}">
                <ul>
                    <li th:each="msg : ${suburbError}" th:text="${msg}"></li>
                </ul>
            </div>
        </div>

        </div>

        <!-- CITY -->
        <div class="mb-3">
            <input type="text" class="form-control" id="city" name="city" placeholder="City (optional)"
                   aria-label="city" th:value="${addressDTO.city}">

            <!-- Frontend JS Error -->

            <!-- Backend error -->
        </div>

        <!-- POSTCODE -->
        <div class="mb-3">
            <input type="text" class="form-control" id="postcode" name="postcode" placeholder="Postcode (optional)"
                   aria-label="postcode" th:value="${addressDTO.postcode}">

            <!-- Frontend JS Error -->

            <!-- Backend error -->
        </div>

        <!-- COUNTRY -->
        <div class="mb-3">
            <input type="text" class="form-control" id="country" name="country" placeholder="Country (optional)"
                   aria-label="country" th:value="${addressDTO.country}">

            <!-- Frontend JS Error -->

            <!-- Backend error -->
        </div>

        <div style="height: 50px;"></div>

    </div>
</div>
</body>
<script type="module" src="/js/locationForm.js"></script>
<script type="module" src="/js/locationFormValidation.js"></script>
</html>
