<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="paginationButton(pageNum, label)">
    <form th:action="@{/renovations/search}" method="post" class="m-0">
        <input type="hidden" name="page" th:value="${pageNum}" />
        <input type="hidden" name="cardPerPage" th:value="${cardPerPage}" />
        <button type="submit" class="page-link" th:text="${label}"></button>
    </form>
</div>
</body>
</html>
