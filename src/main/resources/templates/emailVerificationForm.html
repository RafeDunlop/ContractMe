<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
        <title>Verify Email Address</title>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    </head>
    <body>
        <div class="container mt-5">
            <div class="card p-4 shadow">
                <div class="card-body">
                    <h4 class="card-title mb-5">Enter code</h4>
                    <p class="card-text">Check your email for a sign up code.
                    This code will expire in 10 minutes.</p>
                    <form th:action="@{confirm-registration}" method="post">
                        <div class="form-group mb-3">
                            <div class="mb-3">
                                <input type="text" class="form-control" id="code" name="code" placeholder="XXXXXX" aria-lable="code">
                            </div>
                            <button type="submit" class="btn btn-primary">Confirm</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
