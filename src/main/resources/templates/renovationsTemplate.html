<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="English">
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <base th:href="@{/}"/>
    <title>My Renovations</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/viewRenovationStyles.css}">
    <link rel="stylesheet" th:href="@{/css/tags.css}">

</head>
<body>
<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
<div th:replace="~{fragments/confirmPrompt.html :: confirm-prompt}"></div>

<input type="hidden" id="cardsPerPage"/>
<input type="hidden" id="pageNumber" th:value="${pageNumber}" name="page"/>
<input type="hidden" id="totalPages"/>
<input type="hidden" id="userId" th:value="${user.id}">
<input type="hidden" id="globalCsrfToken" name="_csrf" th:value="${_csrf.token}" />

<div id="container" class="card container mt-5 shadow-sm">

    <div id="content-container" class="content-container m-3">
        <div id="content-header">
            <div class="jumbotron d-flex justify-content-between align-items-center">
                <h1 id="header-title" class="text-black">My Renovations</h1>
                <a th:href="@{/renovations/create}" class="btn btn-primary">⊕ Create New Renovation Record</a>
            </div>

            <form id="search-form-table" class="m-0 mb-3">
                <div class="d-flex align-items-end">
                    <div class="col-md-8 me-2">
                        <label class="form-label">Search:</label>
                        <input type="text" name="searchTerm" th:value="${searchTerm}" class="form-control" placeholder="Search renovations"/>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">Search</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Loading Message -->
        <div id="loading-message" class="text-center my-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading renovations...</p>
        </div>

        <!-- Renovation Cards Grid -->
        <div id="elements-container" style="display: none;">
            <div id="table" class="list-group"></div>
        </div>

        <!-- Pagination -->
        <div id="footer" class="mt-2">
            <div class="d-flex justify-content-center">
                <ul class="pagination" id="pagination"></ul>
            </div>
            <div class="alert alert-danger" id="errorMessage" style="margin-top: 20px; display: none;">
                <p id="errorText"></p>
            </div>

            <!-- Back Button -->
            <div class="mt-4">
                <a th:href="@{/home}" class="btn btn-primary">Back To Home</a>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script type="text/javascript" th:src="@{/js/confirmPrompt.js}"></script>
<script type="text/javascript" th:src="@{/js/pagination.js}"></script>
<script type="text/javascript" th:src="@{/js/renovationUtils.js}"></script>
<script type="text/javascript" th:src="@{/js/renovationsInit.js}"></script>
</body>
</html>
