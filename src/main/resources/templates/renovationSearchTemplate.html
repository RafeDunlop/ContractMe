<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/viewRenovationStyles.css}">
    <title>Renovation Records</title>
    <style>
        .truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div class="container">
    <div th:replace="~{fragments/navbar.html :: nav-bar}"></div>
    <div th:replace="~{fragments/confirmPrompt.html :: confirm-prompt}"></div>

    <div class="container mt-2">
        <input type="hidden" id="data-total-pages" th:value="${totalPages}" aria-label="Total number pages"/>
        <input type="hidden" id="tasksPerPage" name="tasksPerPage" th:value="5"/>
        <input type="hidden" th:value="${searchTerm}" name="searchTerm"/>

        <div id="content-container" class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 th:text="${visibility == 'public' ? 'Public Renovation Records' : (visibility == 'user' ? 'Your Renovation Records' : 'Renovation Records')}">Renovation Records</h4>
            </div>

            <!-- Search and Visibility Filter -->
            <form method="post" action="/renovations/search" class="row g-3 mb-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="col-md-4">
                    <label class="form-label">Show:</label>
                    <select name="visibility" class="form-select">
                        <option value="all" th:selected="${visibility == 'all'}">All</option>
                        <option value="public" th:selected="${visibility == 'public'}">Public</option>
                        <option value="user" th:selected="${visibility == 'user'}">User</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Search:</label>
                    <input type="text" name="searchTerm" th:value="${searchTerm}" class="form-control" placeholder="Enter keyword..."/>
                </div>

                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                </div>
            </form>

            <!-- Renovation Cards Grid -->
            <div id="taskGrid" class="task-grid">
                <div th:each="record : ${records}" class="task-card">
                    <a th:href="@{/renovations/view(id=${record.getId()}, page=${pageNumber}, fromSearch=true)}">
                    <div class="card position-relative" style="width: 18rem;">
                        <!-- Badge if user owns the record -->
                        <span class="badge bg-primary position-absolute top-0 end-0 m-2"
                              th:if="${record.user == user}">
                            Yours
                        </span>

                        <div class="card-body">
                            <!-- Renovation record name -->
                            <h5 class="card-title truncate" th:text="${record.name}">Record Name</h5>

                            <!-- Renovation record tags -->
                            <div class="mb-2">
                                <span th:each="tag : ${record.tags}" class="badge bg-secondary me-1" th:text="${tag}">Tag</span>
                            </div>

                            <!-- Renovation record description -->
                            <p class="card-text truncate" th:text="${record.description}">Description</p>

                            <!-- Renovation record publicity status -->
                            <p class="card-text">
                                <span th:if="${record.public}" class="badge bg-success">Public</span>
                                <span th:unless="${record.public}" class="badge bg-secondary">Private</span>
                            </p>
                        </div>
                    </div>
                    </a>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(records)}" class="alert alert-secondary mt-4">
                No renovations match your search.
            </div>

            <div id="footer" class="mt-2">
                <div class="d-flex justify-content-center" th:if="${totalPages > 0}">
                    <ul class="pagination" id="pagination">
                        <!-- First button (AC more than 10 pages) -->
                        <li class="page-item" th:if="${totalPages > 10}">
                            <a class="page-link" href="#" th:href="@{/renovations/search(page=1, renovationPerPage=${renovationPerPage})}">First</a>

                        </li>

                        <!-- Previous button -->
                        <li class="page-item" th:if="${pageNumber > 1}">
                            <a class="page-link" href="#" th:href="@{/renovations/search(page=${pageNumber - 1}, renovationPerPage=${renovationPerPage})}">Prev</a>
                        </li>

                        <!-- Page buttons <= 10 Pages, AC3 -->
                        <li class="page-item" th:if="${totalPages <= 10}" th:each="pageLinkNumber : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${pageLinkNumber == pageNumber} ? 'active'">
                            <a class="page-link" th:href="@{/renovations/search(page=${pageLinkNumber}, renovationPerPage=${renovationPerPage})}" th:text="${pageLinkNumber}"></a>
                        </li>

                        <!-- Page buttons > 10 Pages, AC3 -->
                        <li class="page-item" th:if="${totalPages > 10}"
                            th:each="pageLinkNumber : ${#numbers.sequence(paginationLinksStart, paginationLinksEnd)}"
                            th:classappend="${pageLinkNumber == pageNumber} ? 'active'">
                            <a class="page-link" th:href="@{/renovations/search(page=${pageLinkNumber}, renovationPerPage=${renovationPerPage})}" th:text="${pageLinkNumber}"></a>
                        </li>

                        <!-- Next button -->
                        <li class="page-item" th:if="${pageNumber < totalPages}">
                            <a class="page-link" href="#" th:href="@{/renovations/search(page=${pageNumber + 1}, renovationPerPage=${renovationPerPage})}">Next</a>
                        </li>

                        <!-- Last button (AC more than 10 pages) -->
                        <li class="page-item" th:if="${totalPages > 10}">
                            <a class="page-link" href="#" th:href="@{/renovations/search(page=${totalPages}, renovationPerPage=${renovationPerPage})}">Last</a>
                        </li>

                        <!-- Search field (AC more than 10 pages) --> <!-- CHANGE IF TO 10 after testing -->

                    </ul>
                </div>
        </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript" th:src="@{/js/confirmPrompt.js}"></script>
<script type="text/javascript" th:src="@{/js/renovationPagination.js}"></script>
</html>
