<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <title>Renovation Records</title>
    <style>
        .truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
    <script type="text/javascript" th:src="@{/js/removeTag.js}"></script>
</head>
<body>

<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>

<div class="container mt-4">
    <div class="card p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 th:text="${visibility == 'public' ? 'Public Renovation Records' : (visibility == 'user' ? 'Your Renovation Records' : 'Renovation Records')}">Renovation Records</h4>
        </div>

        <!-- Search and Visibility Filter -->
        <form method="post" action="/renovations/search" class="row g-3 mb-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="col-md-4">
                <label class="form-label">Show:</label>
                <select name="visibility" class="form-select">
                    <option value="all" th:selected="${visibility == 'all'}">All</option>
                    <option value="public" th:selected="${visibility == 'public'}">Public</option>
                    <option value="user" th:selected="${visibility == 'user'}">User</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Search:</label>
                <input type="text" name="searchTerm" th:value="${searchTerm}" class="form-control" placeholder="Enter keyword..."/>
            </div>

            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
        </form>

        <!-- Renovation Cards Grid -->
        <div class="row">
            <div th:each="record : ${records}" class="col-md-3 mb-4">
<!--                <a th:href="@{/renovations/view(id=${record.getId()}, page=${pageNumber}, fromSearch=true)}">-->
                <div class="card position-relative" style="width: 18rem;">
                    <!-- Badge if user owns the record -->
                    <span class="badge bg-primary position-absolute top-0 end-0 m-2"
                          th:if="${record.user == user}">
                        Yours
                    </span>

                    <div class="card-body">
                        <!-- Renovation record name -->
                        <h5 class="card-title truncate" th:text="${record.name}">Record Name</h5>

                        <!-- Renovation record tags -->
                        <div class="mb-2">
                            <div th:each="tag : ${record.tags}" class="badge bg-success d-flex me-1 align-items-center">
                                <span th:text="${tag.getTagName()}"></span>
                                <button class="btn btn-sm  border-0 bg-transparent text-light ms-1"
                                        th:if="${record.user == user}" type="button"
                                        th:attr="data-renovationId=${record.id}, data-csrf=${_csrf.token}, data-tagName=${tag.tagName}"
                                        th:onclick="|removeTag(this)|">
                                    x
                                </button>
                            </div>
                        </div>

                        <!-- Renovation record description -->
                        <p class="card-text truncate" th:text="${record.description}">Description</p>

                        <!-- Renovation record publicity status -->
                        <p class="card-text">
                            <span th:if="${record.public}" class="badge bg-secondary">Public</span>
                            <span th:unless="${record.public}" class="badge bg-danger">Private</span>
                        </p>
                    </div>
                </div>
<!--                </a>-->
            </div>
        </div>
        </a>
        <div th:if="${#lists.isEmpty(records)}" class="alert alert-secondary mt-4">
            No renovations match your search.
        </div>
    </div>
</div>
</body>
</html>
