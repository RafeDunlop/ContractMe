<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <base th:href="@{/}"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/viewRenovationStyles.css}">
    <link rel="stylesheet" th:href="@{/css/tags.css}">
    <title>Renovation Records</title>
</head>
<body>

<div th:replace="~{fragments/navbar.html :: nav-bar}"></div>


<div id="container" class="card container mt-5 shadow-sm">
    <input type="hidden" id="pageNumber" th:value="${pageNumber}" name="page"/>
    <input type="hidden" id="totalPages"/>
    <input type="hidden" id="cardsPerPage"/>
    <input type="hidden" id="userId" th:value="${user.id}"/>

    <div id="content-container" class="content-container m-3">
        <div id="content-header">
            <div class="jumbotron d-flex justify-content-between align-items-center text-center">
                <h1 id="header-title" class="text-black">My Renovations</h1>
            </div>

            <!-- Search and Visibility Filter -->
            <form id="search-form" class="m-0 mb-0">
                <div class="d-flex align-items-end">
                    <div class="col-md-8 me-2">
                        <label class="form-label">Tag Search:</label>
                        <div id="tag-input-container" class="form-control d-flex flex-wrap position-relative mb-3" style="min-height: 40px; cursor: text; " onclick="focusTagInput()">
                            <input type="text" id="tag-input" class="border-0 flex-grow-1" placeholder="Enter tags..." style="outline: none; min-width: 100px;">
                            <ul id="autocomplete-list"
                                class="list-group position-absolute"
                                style="top: 100%; left: 0; z-index: 1000;"></ul>
                        </div>

                        <label class="form-label">Search:</label>
                        <input type="text" name="searchTerm" th:value="${searchTerm}" class="form-control mb-3" placeholder="Enter keyword..."/>
                    </div>
                    <div id="hidden-tag-inputs"></div>
                    <div class="col-md-2 mb-3">
                        <button type="submit" class="btn btn-primary w-100">Search</button>
                    </div>
                </div>
            </form>

            <div class="col-md-4">
                <label class="form-label">Show:</label>
                <select name="visibility" class="form-select" onchange="fetchRenovations(viewmode='cards', resetPage=true)">
                    <option value="all" th:selected="${visibility == 'all'}">All</option>
                    <option value="public" th:selected="${visibility == 'public'}">Public</option>
                    <option value="user" th:selected="${visibility == 'user'}">User</option>
                </select>
            </div>
        </div>

        <!-- Renovation Cards Grid -->
        <div id="elements-container" style="display: none;">
            <div id="grid" class="task-grid">
                <!-- Cards will be injected here by JavaScript -->
            </div>
        </div>

        <div id="loading-message" class="text-center">
            <p>Loading renovations...</p>
        </div>

        <div id="footer" class="mt-2">
            <div class="d-flex justify-content-center">
                <ul class="pagination" id="pagination"></ul>
            </div>
            <div class="alert alert-danger" id="errorMessage" style="margin-top: 20px; display: none;">
                <p id="errorText"></p>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" th:src="@{/js/confirmPrompt.js}"></script>
<script type="text/javascript" th:src="@{/js/renovationUtils.js}"></script>
<script type="text/javascript" th:src="@{/js/pagination.js}"></script>
<script type="module" th:src="@{/js/tagSearch.js}"></script>
<script type="text/javascript" th:src="@{/js/renovationSearchInit.js}"></script>
<script type="module" th:src="@{/js/navbar.js}"></script>

</body>
</html>
